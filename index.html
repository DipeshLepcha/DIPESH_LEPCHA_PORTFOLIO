    <script>
      // Ensure window.fetch is writable and has a setter so browser extensions and network interceptors don't throw TypeError
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            }
          });
        } catch (_) {}
      })();
    </script>
